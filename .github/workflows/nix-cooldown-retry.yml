name: Recheck Nix cooldown

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pull-requests: read

concurrency:
  group: nix-cooldown-retry
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # Only the default branch code runs with Actions write permission.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v9
        with:
          script: |
            const { retry } = require('./.github/scripts/nix-cooldown.cjs');
            await retry({ github, context, core });
